name: Repository checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m compileall -q applications tuning vision archive experiments deployment tools tests
      - run: python -m unittest discover -s tests -v
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: arduino/setup-arduino-cli@v2
      - run: python tools/firmware.py install
      - run: python tools/firmware.py compile
